name: publish cli

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:

# `id-token: write` is what lets npm attach a provenance attestation: a signed statement that this
# exact tarball was built by this workflow, from this commit. Without it, "the source is public" says
# nothing about what anyone actually downloaded.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: `packageManager` in package.json already pins pnpm, and the
      # action refuses to run when both name a version rather than picking one.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # The latest 22.x, not a pinned patch. The floor that matters is the user's, and that is
          # enforced by `engines` and by the runtime check in the daemon — the runner's own version
          # only has to be new enough to run the tests and whatever npm the publish step needs.
          # Pinning 22.13 here made `npm@latest` refuse to install, which wants 22.22 or newer.
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The whole suite, not only the packaged part. A command that ships while the code it bundles
      # is failing its tests is a command nobody should install.
      - run: pnpm lint
      - run: pnpm test

      # The deployment's own addresses are injected here, never committed. They end up in the
      # published tarball, which is where they belong: the command has to know where to call.
      - run: pnpm --filter sorema build
        env:
          SOREMA_API_URL: ${{ secrets.SOREMA_API_URL }}
          SOREMA_TUNNEL_URL: ${{ secrets.SOREMA_TUNNEL_URL }}

      # Trusted publishing authenticates with the OIDC token GitHub mints for this workflow, so
      # there is no long-lived npm credential anywhere — not in this file, not in a repository
      # secret, not on anyone's laptop. It needs npm 11.5.1 or newer, which the Node 22 runner does
      # not ship.
      - run: npm install --global npm@latest

      - run: npm publish --provenance --access public
        working-directory: cli
